name: EduFlow CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EDUFLOW_PUBLIC_LAUNCH: 'false'
      EDUFLOW_ANALYTICS_ENABLED: 'false'
      OPENAI_API_KEY: ''
      GOOGLE_API_KEY: ''
      GEMINI_API_KEY: ''
      MONGOMS_VERSION: '8.2.6'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository's npm version
        run: npm install --global npm@10.8.2

      - name: Install locked dependencies
        run: npm ci

      - name: Run material, quota and security unit tests
        run: npm --workspace EduFlow run test:security

      # These checks explicitly bootstrap the existing local-synthetic hosting
      # profile. A production server is deliberately denied by the current policy.
      - name: Run hosting policy and learning regression tests
        working-directory: EduFlow
        run: >-
          node --import ./tests/helpers/setup-unit-hosting.mjs --test
          tests/hosting-capabilities.test.mjs
          tests/hosting-provider-foundations.test.mjs
          tests/learning-v2-phase0.test.mjs
          tests/learning-v2-phase1.test.mjs
          tests/learning-v2-phase2.test.mjs
          tests/learning-v2-h12a.test.mjs

      - name: Verify atomic quota and save transactions in a disposable replica set
        working-directory: EduFlow
        env:
          RUN_WORKSHEET_USAGE_MONGO: '1'
        run: node --test tests/worksheet-usage.mongo.integration.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # npm runs prebuild, build and postbuild. This compiles production output;
      # it does not grant a hosting capability or publish a deployment.
      - name: Build production application with lifecycle checks
        run: npm --workspace EduFlow run build 2>&1 | tee "$RUNNER_TEMP/eduflow-build.log"

      # A successful compilation does not prove the traced standalone package
      # can boot. The existing runner also verifies production stays denied.
      - name: Verify standalone boot and production capability boundaries
        working-directory: EduFlow
        run: >-
          node scripts/learning-v2-release/runner.mjs
          production-all-off production-all-requested-on
          2>&1 | tee "$RUNNER_TEMP/eduflow-standalone.log"

      # The browser dependency is isolated from the application and its lockfile.
      # The exact Playwright version selects its matching Chromium binary.
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/eduflow-browser" --no-package-lock --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/eduflow-browser/node_modules/playwright/cli.js" install --with-deps --no-shell chromium
          python3 -m venv "$RUNNER_TEMP/eduflow-pdf"
          "$RUNNER_TEMP/eduflow-pdf/bin/python" -m pip install pypdf==6.10.0

      - name: Verify eleven question types, exports, student flow and API authorization
        working-directory: EduFlow
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/eduflow-browser/node_modules/playwright
          PLAYWRIGHT_CHANNEL: chromium
          PDF_REVIEW_PYTHON: ${{ runner.temp }}/eduflow-pdf/bin/python
          RUN_API_AUTHZ_SMOKE: '1'
        run: node tests/browser/worksheet-launch-smoke.cjs 2>&1 | tee "$RUNNER_TEMP/eduflow-browser.log"

      - name: Collect synthetic test artifacts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/eduflow-ci-artifacts"
          for file in "$RUNNER_TEMP/eduflow-build.log" "$RUNNER_TEMP/eduflow-standalone.log" "$RUNNER_TEMP/eduflow-browser.log" EduFlow/.tmp/launch-smoke/*.pdf EduFlow/.tmp/launch-smoke/*.docx EduFlow/.tmp/launch-smoke/*.png; do
            if [ -f "$file" ]; then
              cp "$file" "$RUNNER_TEMP/eduflow-ci-artifacts/"
            fi
          done

      - name: Upload synthetic exports and check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eduflow-launch-regression
          path: ${{ runner.temp }}/eduflow-ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
